  </div>`;
}

/* ================= OLAYLAR ================= */
function setSeg(i,k,v){
  const s=S.segs[i]; if(!s) return;
  if(k==='mat'){ s.mat=v; const m=MATERIALS[v]; s.eps=m.eps; if(m.sizes.length){ const pick=m.sizes.reduce((b,x)=>Math.abs(x[1]-s.id)<Math.abs(b[1]-s.id)?x:b); s.size=pick[0]; s.id=pick[1]; } else s.size='__c'; save(); render(); return; }
  if(k==='size'){ s.size=v; if(v!=='__c'){ const z=(MATERIALS[s.mat]||MATERIALS.custom).sizes.find(x=>x[0]===v); if(z) s.id=z[1]; } save(); render(); return; }
  if(k==='name'){ s.name=v; save(); return; }
  s[k]=+v; save();
}
document.addEventListener('input',ev=>{
  const t=ev.target, id=t.id;
  if(t.dataset.seg!==undefined && t.tagName!=='SELECT'){ setSeg(+t.dataset.seg,t.dataset.k,t.value); if(t.dataset.k!=='name') compute(); return; }
  const map={in_dz:'dz',in_extra:'extraBar',in_T:'T',in_nN:'nN',in_tp:'targetP',in_tol:'tol'};
  if(map[id]){ S[map[id]]=+t.value; save(); compute(); return; }
  if(id==='pf_maxKw'){ S.pf.maxKw=t.value; save(); compute(); return; }
  if(id==='nf_qTot'){ S.nf.qTot=t.value; save(); compute(); return; }
  if(id==='nf_qTol'){ S.nf.qTol=+t.value; save(); compute(); return; }
  if(id==='cat_q'){ S.cat.q=t.value; S.cat.limit=48; save(); const pos=t.selectionStart; outKatalog($('#out')); const n=$('#cat_q'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if((id.startsWith('lab_')&&id!=='lab_sens')||id.startsWith('labr_')){ const k=id.replace(/^labr?_/,''); S.lab=Object.assign(labVals(),{[k]:+t.value}); save(); syncLabInputs(labVals()); updateLab(); return; }
  if(id==='pk_q'){ $('#pk_list').innerHTML=pickerList(t.dataset.pk,t.value); return; }
});
document.addEventListener('change',ev=>{
  const t=ev.target, id=t.id;
  if(t.dataset.seg!==undefined && t.tagName==='SELECT'){ setSeg(+t.dataset.seg,t.dataset.k,t.value); return; }
  if(id==='pf_brand'){ S.pf.brand=t.value; S.pf.cat='all'; save(); render(); return; }
  if(id==='pf_cat'){ S.pf.cat=t.value; save(); compute(); return; }
  if(id==='pf_volt'){ S.pf.volt=t.value; save(); compute(); return; }
  if(id==='pf_rpm'){ S.pf.rpm=t.value; save(); compute(); return; }
  if(id==='nf_series'){ S.nf.series=t.value; save(); compute(); return; }
  if(id==='nf_angle'){ S.nf.angle=t.value; save(); compute(); return; }
  if(id==='nf_perPump'){ S.nf.perPump=t.checked; save(); compute(); return; }
  if(id==='lab_sens'){ S.lab=Object.assign(labVals(),{sens:t.value}); save(); updateLab(); return; }
  if(id==='in_eur'){ S.eurUsd=+t.value||1.1; save(); compute(); return; }
  if(id==='cat_brand'){ S.cat.brand=t.value; S.cat.group='all'; S.cat.limit=48; save(); outKatalog($('#out')); return; }
  if(id==='cat_group'){ S.cat.group=t.value; S.cat.limit=48; save(); outKatalog($('#out')); return; }
});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-ri],[data-pickpump],[data-picknoz],[data-detail-pump],[data-detail-noz],.modal');
  if(!t) return;
  const d=t.dataset;
  if(t.id==='mdl' && ev.target===t){ closeModal(); return; }
  if(d.mode){ S.mode=d.mode; save(); render(); window.scrollTo(0,0); return; }
  if(d.close){ closeModal(); return; }
  if(d.step){ const inp=document.getElementById(d.for); inp.value=Math.max(0,(+inp.value||0)+(+d.step)); inp.dispatchEvent(new Event('input',{bubbles:true})); return; }
  if(t.id==='addSeg'){ const last=S.segs.at(-1); S.segs.push(Object.assign({},last,{name:'Bölüm '+(S.segs.length+1),n90:0,n45:0,teeR:0,teeB:0,ball:0,gate:0,check:0,filt:0,kx:0})); save(); render(); return; }
  if(d.delseg!==undefined){ S.segs.splice(+d.delseg,1); save(); render(); return; }
  if(d.open){ openPicker(d.open); return; }
  if(d.pickpump){ S.pumpId=d.pickpump; save(); closeModal(); render(); return; }
  if(d.picknoz){ S.nozzleId=d.picknoz; save(); closeModal(); render(); return; }
  if(d.kind){ S.pf.kind=d.kind; S.pf.cat='all'; save(); render(); return; }
  if(d.sort){ S.sort=d.sort; save(); compute(); return; }
  if(d.quick!==undefined){ pumpQuick(+d.quick); return; }
  if(d.ri!==undefined){ selRank=+d.ri; document.querySelectorAll('.ri').forEach((e,i)=>e.classList.toggle('sel',i===selRank)); if(S.mode==='kombi') drawCombo(); else { const n=nozById(S.nozzleId); const sys=makeSystem(n,Math.max(1,+S.nN||1)); drawCompare(sys, reqCard(n,sys,+S.targetP), +S.targetP); const r=lastRank[selRank]; if(r && ev.detail>=2){ S.pumpId=r.p.id; S.mode='analiz'; save(); render(); } } return; }
  if(d.goanaliz){ const r=lastRank[selRank]; if(r){ S.pumpId=r.p.id; S.nozzleId=r.n.id; S.mode='analiz'; save(); render(); window.scrollTo(0,0);} return; }
  if(d.detailPump){ pumpDetail(d.detailPump); return; }
  if(d.detailNoz){ nozDetail(d.detailNoz); return; }
  if(d.usepump){ S.pumpId=d.usepump; S.mode='analiz'; save(); closeModal(); render(); return; }
  if(d.usenoz){ S.nozzleId=d.usenoz; S.mode='analiz'; save(); closeModal(); render(); return; }
  if(t.id==='resetAll'){ if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Emin misiniz? Sıfırlamak için tekrar basın'; return; }
    const keep={custom:S.custom, theme:S.theme}; S=Object.assign(JSON.parse(JSON.stringify(DEF)), keep); S.mode='analiz'; save(); rebuildDB(); render(); window.scrollTo(0,0); return; }
  if(t.id==='labReset'){ S.lab=null; save(); syncLabInputs(labVals()); updateLab(); return; }
  if(t.id==='labRef'){ S.labRef=labCalc(labVals()); S.labRef={Qlpm:S.labRef.Qlpm,vel:S.labRef.vel,hf:S.labRef.hf,hk:S.labRef.hk,H:S.labRef.H,Pout:S.labRef.Pout,Phyd:S.labRef.Phyd}; save(); updateLab(); return; }
  if(t.id==='labFromSys'){ const n=nozById(S.nozzleId), s0=S.segs[0]||{}; S.lab=Object.assign(labVals(),{P:+S.targetP||3,n:Math.max(1,+S.nN||1),q2:n?+n.q2.toFixed(3):10,e:n?+n.e.toFixed(3):0.5,D:+s0.id||40,eps:+s0.eps||0.15,L:S.segs.reduce((a,s)=>a+(+s.L||0),0),K:+S.segs.reduce((a,s)=>a+segK(s),0).toFixed(2),dz:+S.dz||0,T:+S.T||20}); save(); syncLabInputs(labVals()); updateLab(); return; }
  if(d.brandchip){ S.pf.brand=d.brandchip; S.pf.cat='all'; save(); render(); return; }
  if(d.cattab){ S.cat.tab=d.cattab; S.cat.brand='all'; S.cat.group='all'; S.cat.limit=48; save(); outKatalog($('#out')); return; }
  if(t.id==='catMore'){ S.cat.limit+=48; outKatalog($('#out')); return; }
  if(d.addcustom){ customForm(d.addcustom==='pump'?'pump':'noz'); return; }
  if(d.delcustom){ const [k,id]=d.delcustom.split(':'); if(k==='pump') S.custom.pumps=S.custom.pumps.filter(x=>x.id!==id); else S.custom.nozzles=S.custom.nozzles.filter(x=>x.id!==id); save(); rebuildDB(); closeModal(); render(); return; }
  if(t.id==='themeBtn'){ const order=['system','light','dark']; S.theme=order[(order.indexOf(S.theme)+1)%3]; applyTheme(); save(); render(); return; }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') closeModal();
  if(ev.target.matches('input,textarea,select')) return;
  const k={'1':'analiz','2':'pompa','3':'kombi','4':'katalog','5':'yontem','6':'kilavuz'}[ev.key]; if(k && !$('#mdl')){ S.mode=k; save(); render(); }
});
function applyTheme(){ const r=document.documentElement; if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); $('#themeBtn').textContent='Tema: '+({system:'Sistem',light:'Açık',dark:'Koyu'}[S.theme]); }

applyTheme(); rebuildDB(); render();
</script>
